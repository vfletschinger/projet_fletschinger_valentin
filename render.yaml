# Blueprint Render pour le déploiement du projet pédagogique Pollution
# Inclut la base de données PostgreSQL et l'API Node.js/TypeScript.
# Le front Angular est déployé séparément (service statique existant).

databases:
  - name: pollution-db
    databaseName: pollution_db
    user: pollution_user
    plan: free
    region: oregon

services:
  # -------------------------------------------------------------
  # API Backend Node.js / Express / Sequelize / TypeScript
  # -------------------------------------------------------------
  - type: web
    name: pollution-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString
